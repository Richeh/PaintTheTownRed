services:
  web:
    image: nginx:latest # Using the default Nginx image with custom configuration.
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
      # Mount the Nginx configuration file
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_HOST=localhost
    networks:
      - traefik-proxy
      - TownRed
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.townred.rule=Host(`townred.rainysundays.co.uk`) || Host(`www.townred.rainysundays.co.uk`)
      - traefik.http.routers.townred.entrypoints=websecure
      - traefik.http.routers.townred.tls=true
      - traefik.http.routers.townred.tls.certresolver=letsencrypt
      - traefik.http.services.townred.loadbalancer.server.port=80

    depends_on:
      php-fpm:
        condition: service_started # Wait for php-fpm to start

  php-fpm:
    # For the php-fpm service, we will use our common PHP-FPM Dockerfile with the development target
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      # Load the environment variables from the Laravel application
      - .env
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
    networks:
      - TownRed
    environment:
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 128M


networks:
  TownRed:
    external: true
    name: TownRed
  traefik-proxy:
    external: true
    name: traefik-proxy

volumes:
  postgres-data-development:
